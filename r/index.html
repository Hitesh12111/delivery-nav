<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#eceeec" />
  <title>Delivery Nav · Tower 14 · Flat 304</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body class="rider">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div class="veil"></div>

  <header class="topbar">
    <div class="brand"><span class="mark"></span><span>DELIVERY NAV</span></div>
    <button class="icon-btn" id="replay" aria-label="Replay">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <section class="dest-card" id="destCard">
    <div class="eyebrow" id="destSoc"></div>
    <h1 class="dest-title" id="destTitle"></h1>
    <div class="status"><span class="tick"><svg viewBox="0 0 16 16" width="10" height="10"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Delivery route ready</span></div>
  </section>

  <section class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="sheet-row">
      <div class="dist"><b id="dist">—</b><span>m</span></div>
      <div class="via"><span id="via"></span><small id="enter"></small></div>
    </div>
    <ol class="chain" id="chain"></ol>
    <div class="sheet-foot">
      <label class="compare">
        <input type="checkbox" id="compare" autocomplete="off" />
        <span class="switch"></span>
        <span>Compare resident route</span>
      </label>
      <div class="legend">
        <span class="lg lg-del"><i></i>Delivery</span>
        <span class="lg lg-res"><i></i>Resident</span>
      </div>
    </div>
    <button class="primary" id="start">
      <span>Start navigation</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <div class="toast" id="toast"></div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
